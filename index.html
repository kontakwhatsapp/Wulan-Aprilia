<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Wulan Aprilia</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#53677f}
body{min-height:100vh}
.topbar{height:60px;border-bottom:1px solid #e2e2e2;display:flex;align-items:center;justify-content:space-between;padding:0 29px 0 57px;background:#fff}
.logo{font-size:21px;font-weight:700;letter-spacing:-.4px;color:#252d38}
.header-icons{display:flex;align-items:center;gap:22px}
.icon{width:23px;height:23px;display:block}
.profile-container{width:100%;max-width:500px;margin:0 auto;text-align:center;padding-top:10px}
.profile-photo{width:130px;height:130px;margin:0 auto 29px;border-radius:50%;border:2px solid #edf0f2;background:#f7f8f9;box-shadow:0 4px 12px rgba(0,0,0,.07);overflow:hidden}
.profile-photo img{width:100%;height:100%;object-fit:cover;display:block}
.name{font-size:18px;font-weight:400;margin:0 0 4px;color:#53677f}
.description{max-width:315px;margin:0 auto;font-size:16px;line-height:1.35;color:#53677f}
.buttons{width:200px;margin:30px auto 0}
.action-btn{width:200px;height:44px;margin-bottom:14px;border:0;border-radius:25px;background:#20d269;color:#fff;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.10);transition:.15s}
.action-btn:hover{background:#19c461;transform:translateY(-1px)}
.action-btn:active{transform:translateY(1px)}
.download{margin-top:9px;font-size:13px;line-height:1.8;color:#6d7e91}
.download a{color:#00a88f;text-decoration:none;border-bottom:1px dotted #00a88f}
@media(max-width:600px){
.topbar{height:58px;padding:0 18px 0 20px}
.logo{font-size:19px}
.header-icons{gap:17px}
.profile-container{padding-top:10px}
}
</style>
</head>
<body>

<header class="topbar">
<div class="logo">KONTAKWA</div>
<div class="header-icons">
<svg class="icon" viewBox="0 0 24 24" fill="none" aria-label="Pengaturan">
<path d="M9.7 2.7h4.6l.65 2.25c.45.16.88.34 1.29.54l2.18-1.02 3.25 3.25-1.02 2.18c.2.41.38.84.54 1.29l2.25.65v4.6l-2.25.65c-.16.45-.34.88-.54 1.29l1.02 2.18-3.25 3.25-2.18-1.02c-.41.2-.84.38-1.29.54L14.3 21.7H9.7l-.65-2.25a10.7 10.7 0 0 1-1.29-.54l-2.18 1.02-3.25-3.25 1.02-2.18a10.7 10.7 0 0 1-.54-1.29L.56 12.56v-4.6l2.25-.65c.16-.45.34-.88.54-1.29L2.33 3.84l3.25-3.25 2.18 1.02c.41-.2.84-.38 1.29-.54L9.7 2.7Z" transform="scale(.9) translate(1.3 1.3)" stroke="#6c7c91" stroke-width="1.4"/>
<circle cx="12" cy="10.25" r="3.1" stroke="#6c7c91" stroke-width="1.4"/>
</svg>
<svg class="icon" viewBox="0 0 24 24" fill="none" aria-label="Pencarian">
<circle cx="10.8" cy="10.8" r="7.2" stroke="#6c7c91" stroke-width="1.8"/>
<path d="M16.2 16.2L21 21" stroke="#6c7c91" stroke-width="1.8" stroke-linecap="round"/>
</svg>
</div>
</header>

<main class="profile-container">
<div class="profile-photo">
<img src="images/profil.png" alt="Profil Wulan Aprilia">
</div>

<h1 class="name">Wulan Aprilia</h1>

<p class="description">
Lanjutkan untuk mengirim pesan atau<br>
melakukan Video Call langsung melalui<br>
WhatsApp.
</p>

<div class="buttons">
<a class="action-btn" href="https://omg10.com/4/11941268">KIRIM PESAN</a>
<a class="action-btn" href="https://omg10.com/4/11941268">VIDEO CALL</a>
<a class="action-btn" href="https://omg10.com/4/11941268">PANGGILAN</a>
</div>

<div class="download">
Belum punya WhatsApp?<br>
<a href="https://omg10.com/4/11941268" target="_blank" rel="noopener">Unduh Sekarang</a>
</div>
</main>
</body>
</html>
